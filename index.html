<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Protocol</title>

<style>
:root{
  --bg:#071018;
  --panel:#0d1720;
  --panel2:#101c25;
  --line:#213746;
  --text:#edf6fa;
  --muted:#8298a5;
  --green:#5ee6a8;
  --yellow:#ffd166;
  --red:#ff6b7a;
  --cyan:#44d8ff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  background-image:
    linear-gradient(rgba(68,216,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(68,216,255,.025) 1px, transparent 1px);
  background-size:28px 28px;
}

main{
  max-width:860px;
  margin:0 auto;
  padding:24px 14px 40px;
}

.header{
  margin-bottom:16px;
}

.kicker{
  font-size:11px;
  letter-spacing:.18em;
  color:var(--cyan);
  font-weight:700;
}

h1{
  font-size:clamp(24px,6vw,38px);
  margin:5px 0 3px;
  letter-spacing:.04em;
}

.help{
  font-size:12px;
  color:var(--muted);
}

.protocol{
  border:1px solid var(--line);
  background:rgba(13,23,32,.96);
}

.item{
  border-bottom:1px solid var(--line);
}

.item:last-child{
  border-bottom:none;
}

.item-main{
  display:grid;
  grid-template-columns:42px minmax(0,1fr) 138px;
  gap:12px;
  align-items:center;
  min-height:76px;
  padding:12px 14px;
}

.number{
  font-size:11px;
  color:var(--muted);
  letter-spacing:.14em;
}

.title{
  font-size:14px;
  font-weight:800;
  letter-spacing:.07em;
}

.desc{
  margin-top:4px;
  font-size:11px;
  color:var(--muted);
  line-height:1.45;
}

.current{
  min-height:44px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--panel2);
  font-size:13px;
  font-weight:800;
  letter-spacing:.06em;
  cursor:pointer;
  color:var(--text);
}

.current.good{
  color:var(--green);
  border-color:rgba(94,230,168,.45);
  background:rgba(94,230,168,.08);
}

.current.warn{
  color:var(--yellow);
  border-color:rgba(255,209,102,.45);
  background:rgba(255,209,102,.08);
}

.current.bad{
  color:var(--red);
  border-color:rgba(255,107,122,.45);
  background:rgba(255,107,122,.08);
}

.choices{
  display:none;
  padding:0 14px 14px 68px;
}

.item.open .choices{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}

.choice{
  min-height:42px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#0a131a;
  color:var(--text);
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.choice[data-state="good"]{
  color:var(--green);
}

.choice[data-state="warn"]{
  color:var(--yellow);
}

.choice[data-state="bad"]{
  color:var(--red);
}

.decision{
  margin-top:16px;
  padding:18px;
  border:1px solid var(--line);
  background:rgba(13,23,32,.96);
}

.decision-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.13em;
}

#decision{
  margin-top:6px;
  font-size:clamp(32px,9vw,54px);
  font-weight:900;
  letter-spacing:.12em;
}

#decision.buy{
  color:var(--green);
}

#decision.wait{
  color:var(--yellow);
}

#decision.pass{
  color:var(--red);
}

#reason{
  margin-top:4px;
  font-size:12px;
  color:var(--muted);
  line-height:1.55;
}

.footer{
  display:flex;
  justify-content:flex-end;
  margin-top:12px;
}

#reset{
  min-height:42px;
  padding:0 14px;
  border-radius:8px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}

button:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}

@media(max-width:600px){
  .item-main{
    grid-template-columns:34px minmax(0,1fr);
    padding:12px;
  }

  .current{
    grid-column:1 / -1;
    width:100%;
  }

  .choices{
    padding:0 12px 12px;
  }

  .item.open .choices{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<main>

  <div class="header">
    <div class="kicker">SHORT-TERM SWING SYSTEM</div>
    <h1>INVESTMENT PROTOCOL</h1>
    <div class="help">判定をタップ → 選択肢を選ぶ</div>
  </div>

  <section class="protocol" id="protocol">

    <div class="item" data-key="market">
      <div class="item-main">
        <div class="number">01</div>
        <div>
          <div class="title">MARKET TREND</div>
          <div class="desc">TOPIX・業種の方向</div>
        </div>
        <button type="button" class="current good" data-state="good">
          STRONG
        </button>
      </div>

      <div class="choices">
        <button type="button" class="choice" data-state="good">STRONG</button>
        <button type="button" class="choice" data-state="warn">NEUTRAL</button>
        <button type="button" class="choice" data-state="bad">WEAK</button>
      </div>
    </div>

    <div class="item" data-key="event">
      <div class="item-main">
        <div class="number">02</div>
        <div>
          <div class="title">EVENT CHECK</div>
          <div class="desc">決算・権利日などの直近イベント</div>
        </div>
        <button type="button" class="current good" data-state="good">
          CLEAR
        </button>
      </div>

      <div class="choices">
        <button type="button" class="choice" data-state="good">CLEAR</button>
        <button type="button" class="choice" data-state="warn">CAUTION</button>
        <button type="button" class="choice" data-state="bad">HIGH RISK</button>
      </div>
    </div>

    <div class="item" data-key="momentum">
      <div class="item-main">
        <div class="number">03</div>
        <div>
          <div class="title">MOMENTUM</div>
          <div class="desc">20MA・5MA・出来高</div>
        </div>
        <button type="button" class="current good" data-state="good">
          STRONG
        </button>
      </div>

      <div class="choices">
        <button type="button" class="choice" data-state="good">STRONG</button>
        <button type="button" class="choice" data-state="warn">GOOD</button>
        <button type="button" class="choice" data-state="bad">WEAK</button>
      </div>
    </div>

    <div class="item" data-key="fundamental">
      <div class="item-main">
        <div class="number">04</div>
        <div>
          <div class="title">FUNDAMENTAL</div>
          <div class="desc">
            PBR・ROIC・営業利益成長・自己資本比率
          </div>
        </div>
        <button type="button" class="current good" data-state="good">
          GOOD
        </button>
      </div>

      <div class="choices">
        <button type="button" class="choice" data-state="good">GOOD</button>
        <button type="button" class="choice" data-state="warn">NORMAL</button>
        <button type="button" class="choice" data-state="bad">WEAK</button>
      </div>
    </div>

    <div class="item" data-key="entry">
      <div class="item-main">
        <div class="number">05</div>
        <div>
          <div class="title">ENTRY</div>
          <div class="desc">5日線乖離と押し目の位置</div>
        </div>
        <button type="button" class="current warn" data-state="warn">
          WAIT
        </button>
      </div>

      <div class="choices">
        <button type="button" class="choice" data-state="good">ENTRY</button>
        <button type="button" class="choice" data-state="warn">WAIT</button>
        <button type="button" class="choice" data-state="bad">CHASE</button>
      </div>
    </div>

    <div class="item" data-key="risk">
      <div class="item-main">
        <div class="number">06</div>
        <div>
          <div class="title">RISK / EXIT</div>
          <div class="desc">
            損切り -5% / 利確 +10% / 最大20営業日
          </div>
        </div>
        <button type="button" class="current good" data-state="good">
          OK
        </button>
      </div>

      <div class="choices">
        <button type="button" class="choice" data-state="good">OK</button>
        <button type="button" class="choice" data-state="warn">CHECK</button>
        <button type="button" class="choice" data-state="bad">NG</button>
      </div>
    </div>

  </section>

  <section class="decision">
    <div class="decision-top">
      <span>SYSTEM DECISION</span>
      <span>AUTO</span>
    </div>

    <div id="decision" class="wait">
      WAIT
    </div>

    <div id="reason">
      ENTRY を再確認。
    </div>
  </section>

  <div class="footer">
    <button type="button" id="reset">
      RESET
    </button>
  </div>

</main>

<script>
(function(){

  const protocol = document.getElementById('protocol');
  const decision = document.getElementById('decision');
  const reason = document.getElementById('reason');
  const reset = document.getElementById('reset');

  const names = {
    market:'MARKET TREND',
    event:'EVENT CHECK',
    momentum:'MOMENTUM',
    fundamental:'FUNDAMENTAL',
    entry:'ENTRY',
    risk:'RISK / EXIT'
  };

  function closeAll(except){

    protocol.querySelectorAll('.item.open').forEach(function(item){

      if(item !== except){
        item.classList.remove('open');
      }

    });

  }

  function evaluate(){

    const items = Array.from(
      protocol.querySelectorAll('.item')
    );

    const bad = items.filter(function(item){

      return item.querySelector('.current').dataset.state === 'bad';

    });

    const warn = items.filter(function(item){

      return item.querySelector('.current').dataset.state === 'warn';

    });

    decision.className = '';

    if(bad.length){

      decision.textContent = 'PASS';
      decision.classList.add('pass');

      reason.textContent =
        names[bad[0].dataset.key] +
        ' が見送り条件。';

      return;
    }

    if(warn.length){

      decision.textContent = 'WAIT';
      decision.classList.add('wait');

      reason.textContent =
        names[warn[0].dataset.key] +
        ' を再確認。';

      return;
    }

    decision.textContent = 'BUY';
    decision.classList.add('buy');

    reason.textContent =
      '全条件クリア。購入候補として検討可能。';

  }

  protocol.querySelectorAll('.current').forEach(function(button){

    button.addEventListener('click', function(){

      const item = button.closest('.item');

      const willOpen =
        !item.classList.contains('open');

      closeAll(item);

      item.classList.toggle(
        'open',
        willOpen
      );

    });

  });

  protocol.querySelectorAll('.choice').forEach(function(choice){

    choice.addEventListener('click', function(){

      const item = choice.closest('.item');
      const current = item.querySelector('.current');

      current.textContent =
        choice.textContent;

      current.dataset.state =
        choice.dataset.state;

      current.classList.remove(
        'good',
        'warn',
        'bad'
      );

      current.classList.add(
        choice.dataset.state
      );

      item.classList.remove('open');

      evaluate();

    });

  });

  reset.addEventListener('click', function(){

    const defaults = {

      market:['STRONG','good'],
      event:['CLEAR','good'],
      momentum:['STRONG','good'],
      fundamental:['GOOD','good'],
      entry:['WAIT','warn'],
      risk:['OK','good']

    };

    protocol.querySelectorAll('.item').forEach(function(item){

      const current =
        item.querySelector('.current');

      const d =
        defaults[item.dataset.key];

      current.textContent =
        d[0];

      current.dataset.state =
        d[1];

      current.classList.remove(
        'good',
        'warn',
        'bad'
      );

      current.classList.add(
        d[1]
      );

      item.classList.remove('open');

    });

    evaluate();

  });

  evaluate();

})();
</script>

</body>
</html>
